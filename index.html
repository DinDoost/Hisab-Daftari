<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#26619c">
<title>حساب دفتری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--card:#fff;--text:#1f2937;--muted:#64748b;--pri:#26619c;--deep:#1b4a7a;--pos:#1e7a4c;--neg:#c0392b;--line:#dfe3ea;--soft:#e6edf8;--ok:#1e9e62}
*{box-sizing:border-box;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit}
#main{max-width:520px;margin:0 auto;padding:0 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 12px}
.top h1{font-size:19px;font-weight:700}
.top .sp{width:42px;height:42px}
.ic{background:none;border:0;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
button:focus-visible,input:focus-visible{outline:3px solid #9fb9de;outline-offset:2px}
.ic svg,.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(135deg,#3a72b0,var(--deep));color:#fff;border-radius:26px;padding:22px 20px;box-shadow:0 10px 30px rgba(27,74,122,.25)}
.hero .lbl{opacity:.9;font-size:14px}
.hero .net{font-size:30px;font-weight:700;margin:10px 0 16px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;direction:rtl}
.hero .net small{font-size:14px;font-weight:400;opacity:.95}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:rgba(255,255,255,.16);border-radius:16px;padding:12px}
.mini span{font-size:13px;opacity:.92}
.mini span.sm{font-size:11px}
.mini b{display:block;margin-top:6px;font-size:15px;direction:ltr;text-align:right}
.search{margin-top:14px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid #9fb9de;border-color:transparent}
.sec-title{margin:22px 4px 0;font-size:15px;font-weight:700}
.list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%;color:inherit;text-align:right;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.nm{flex:1;display:flex;flex-direction:column;min-width:0}
.nm b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-card{padding-left:60px}
.tx-nm b{font-size:13px;line-height:1.55;font-weight:600;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;line-clamp:4;word-break:break-word}
.nm small{color:var(--muted);font-size:12px;margin-top:3px}
.tx-nm b[data-a]{cursor:pointer}
.tx-nm b.open{display:block;-webkit-line-clamp:unset;line-clamp:unset;overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere}
.bal{font-size:14px;font-weight:600;direction:ltr;white-space:nowrap;text-align:left}
.pos{color:var(--pos)}.neg{color:var(--neg)}.zero{color:var(--muted)}
.bpos{color:#0d6b33;font-weight:700}
.bneg{color:#c0392b;font-weight:700}
.bal-col{display:flex;flex-direction:column;align-items:center;gap:1px;flex:none;transform:translateY(-4px)}
.bal-note{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;line-height:1.3;letter-spacing:0}
.cb-hero{background:linear-gradient(135deg,#3a72b0,#1b4a7a);color:#fff;border-radius:22px;padding:22px 20px;margin:4px 0 16px;box-shadow:0 10px 24px rgba(27,74,122,.18)}
.cb-lbl{font-size:14px;opacity:.85;font-weight:500}
.cb-net{font-size:34px;font-weight:600;margin:6px 0 16px;letter-spacing:0}
.cb-net.cb-pos,.cb-pos{color:#bff0d3}
.cb-net.cb-neg,.cb-neg{color:#ffd0cc}
.cb-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb-card{background:rgba(255,255,255,.14);border-radius:16px;padding:12px 14px}
.cb-card span{display:block;font-size:13px;opacity:.85;margin-bottom:4px;font-weight:500}
.cb-card b{font-size:16px;font-weight:600}
.cb-title{font-size:15px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.cb-row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.cb-m{font-size:16px;font-weight:600;margin-bottom:8px}
.cb-vals{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:14px}
.cb-in{color:#1e7a4c;font-weight:500}
.cb-out{color:#c0392b;font-weight:500}
.cb-vals b{margin-right:auto;font-size:15px;font-weight:600}
.lg-form{padding:16px}
.lg-form .tbtns{margin-bottom:12px}
.lg-save{width:100%;margin-top:6px;border:0;border-radius:14px;padding:14px;background:var(--pri);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.lg-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.lg-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lg-main b{font-size:15px;font-weight:600}
.lg-main span{font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-main small{font-size:12px;color:var(--muted)}
.lg-main span[data-a="lgDescToggle"]{cursor:pointer}
.lg-main span.open{white-space:pre-wrap;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.7}
.lg-del{border:0;background:#fdecea;color:#c0392b;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;flex:none}
.lg-more{border:0;background:var(--soft);color:var(--deep);width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:700;line-height:1;cursor:pointer;flex:none}
.lg-acts{display:flex;gap:8px;margin:-2px 0 10px}
.lg-acts button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;background:var(--soft);color:var(--deep)}
.lg-acts button.del{background:#fdecea;color:#c0392b}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:44px 12px;line-height:1.9}
.fab{position:fixed;bottom:22px;left:20px;background:var(--pri);color:#fff;border:0;border-radius:999px;padding:15px 24px;font-weight:600;box-shadow:0 10px 24px rgba(38,97,156,.35);cursor:pointer;display:flex;gap:10px;align-items:center}
.fab svg{width:20px;height:20px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round}
.overlay{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.overlay.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700}
.sheet label{font-size:13px;color:var(--muted);margin-top:4px}
.btn{padding:14px;border-radius:14px;border:0;font-weight:600;cursor:pointer;width:100%;font-size:15px}
.pri-btn{background:var(--pri);color:#fff}
.btn.busy,.bottom-btn.busy,.pbtn.busy{color:transparent!important;pointer-events:none;position:relative}
.busy>*{visibility:hidden}
.btn.busy::after,.bottom-btn.busy::after,.pbtn.busy::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border:4px solid rgba(31,41,55,.25);border-top-color:#1f2937;border-radius:50%;animation:btnspin .7s linear infinite;z-index:2}
.pri-btn.busy::after,.bottom-btn.busy::after{border-color:rgba(255,255,255,.4);border-top-color:#fff}
.danger.busy::after,.pbtn.del.busy::after{border-color:rgba(192,57,43,.3);border-top-color:#c0392b}
@keyframes btnspin{to{transform:rotate(360deg)}}
.danger{background:#fdecea;color:var(--neg)}
.hint{font-size:13px;color:var(--muted);line-height:1.8}
.hidden{display:none!important}
.sub{color:var(--muted);font-size:13px}

/* transaction type buttons */
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{border:0;border-radius:14px;padding:14px 8px;font-weight:700;font-size:14px;cursor:pointer}
.tbtn.g{background:#e3f6ec;color:#1e7a4c}
.tbtn.r{background:#fdecea;color:#c0392b}
.tbtn.g.on{background:#1e7a4c;color:#fff}
.tbtn.r.on{background:#c0392b;color:#fff}

/* date button */
.dbtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-size:15px;cursor:pointer}
.cal-ic svg{width:22px;height:22px;stroke:var(--deep);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* calendar popup */
.cal-ov{align-items:center;padding:16px;z-index:30}
.cal{background:#fff;width:100%;max-width:420px;border-radius:26px;padding:18px 16px 18px}
.cal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.cal-nav{width:44px;height:44px;border-radius:14px;border:0;background:var(--soft);color:var(--deep);cursor:pointer;font-size:22px;display:grid;place-items:center;flex:none}
.cal-title{border:0;background:none;font-size:17px;font-weight:700;color:var(--text);cursor:pointer;padding:8px 12px;border-radius:12px}
.cal-wk,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-wk span{font-size:13px;color:var(--muted);padding:6px 0}
.cal-grid button{height:44px;border:0;border-radius:14px;background:#ecf2fa;color:var(--text);font-size:15px;cursor:pointer}
.cal-grid .blank{height:44px}
.cal-grid button.sel{background:var(--ok);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(30,158,98,.35)}
.cal-years{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cal-years button{height:48px;border:0;border-radius:14px;background:#ecf2fa;color:var(--text);font-size:15px;cursor:pointer}
.cal-years button.sel{background:var(--ok);color:#fff;font-weight:700}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-row{margin:22px 4px 0}
.sec-row .sec-title{margin:0}
.lg-filt{display:flex;gap:6px}
.lg-filt button{border:0;border-radius:999px;background:var(--soft);color:var(--deep);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;cursor:pointer}
.lg-filt button.on{background:var(--pri);color:#fff}
.lg-filt button.on.r{background:#c0392b}
.lg-filt button.on.g{background:#1e7a4c}
.cf-types{display:flex;gap:6px;justify-content:center;align-items:center;flex:1;min-width:0}
.cf-types button{border:0;border-radius:999px;background:var(--soft);color:var(--deep);font:inherit;font-size:14px;font-weight:700;padding:7px 14px;cursor:pointer;line-height:1.3;white-space:nowrap}
.cf-types button.on{background:var(--pri);color:#fff}
.cf-types button.g.on{background:#1e7a4c}
.cf-types button.r.on{background:#c0392b}
.pt-sky{display:block;width:100%;margin:12px 0;padding:18px 16px;border:0;border-radius:16px;background:#c7d7f0;color:#1b4a7a;font:inherit;font-weight:700;font-size:16px;text-align:right;cursor:pointer}
.pt-h-s{font-size:16px;font-weight:800;margin:0;color:#1f2937}
.pt-q{font-size:15px;font-weight:800;text-align:center;color:#1f2937;margin:28px 0 14px}
.pt-q-s{font-size:14px;font-weight:600;text-align:center;color:#374151;margin:24px 0 0}
.pt-sky-s{font-size:14px;font-weight:800;padding:14px 16px}
.pt-bottom{margin-top:auto}
.pt-link{background:none;border:0;color:#c62828;font:inherit;font-weight:700;font-size:16px;padding:12px;cursor:pointer}
.info-h{font-size:20px;font-weight:800;color:#1f2937;margin:20px 0 8px}
.info-h4{font-size:18px;font-weight:800;color:#1f2937;margin:16px 0 6px}
.info-sub{font-size:16px;font-weight:700;color:#26619c;margin:0 0 10px}
.info-p{font-size:16px;line-height:2;color:#374151;margin:0 0 8px}
.lg-bar{display:flex;gap:8px;align-items:center;margin:14px 0 0}
.lg-bar input{flex:1;min-width:0;padding:11px 14px}
.lg-fbtn{border:0;border-radius:14px;background:var(--soft);color:var(--deep);font:inherit;font-weight:700;font-size:14px;padding:11px 16px;cursor:pointer;flex:none}
.lg-fbtn.on{background:var(--pri);color:#fff}
.opt{position:relative}
.opt.busy{color:transparent!important;pointer-events:none}
.opt.busy>*{visibility:hidden}
.opt.busy::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid rgba(31,41,55,.25);border-top-color:#1f2937;border-radius:50%;animation:btnspin .7s linear infinite}
.top .dots{font-size:24px;font-weight:700;line-height:1}
.live-btn{border:0;border-radius:999px;background:var(--pri);color:#fff;font:inherit;font-size:14px;font-weight:700;padding:9px 18px;cursor:pointer;box-shadow:0 6px 16px rgba(38,97,156,.3)}
.dt-row{display:flex;gap:14px;align-items:stretch}
.dt-row .dbtn{flex:1;min-width:0}
#tclk{z-index:31}
.tc-box{background:#fff;border-radius:24px;padding:18px 16px 16px;width:min(340px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.tc-show{display:flex;justify-content:center;align-items:center;gap:8px;direction:ltr;margin-bottom:10px}
.tc-show button{border:0;background:#eaf0fa;color:var(--text);border-radius:14px;padding:4px 14px;font:inherit;font-size:34px;font-weight:700;cursor:pointer}
.tc-show button.on{background:var(--ok);color:#fff}
.tc-show span{font-size:34px;font-weight:700}
.tc-ampm{display:flex;justify-content:center;gap:10px;margin-bottom:8px}
.tc-ampm button{border:0;background:#eaf0fa;color:var(--text);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.tc-ampm button.on{background:var(--pri);color:#fff}
html,body{touch-action:pan-x pan-y;-ms-touch-action:pan-x pan-y}
.tc-face{display:block;width:260px;max-width:100%;height:auto;margin:0 auto;touch-action:none;cursor:pointer}
.tc-face .face{fill:#ecf2fa}
.tc-face text{font-size:15px;fill:var(--text);font-family:inherit;user-select:none}
.tc-face .hand{stroke:var(--ok);stroke-width:3;stroke-linecap:round}
.tc-face .knob{fill:var(--ok)}
.cal-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cal-foot button{height:52px;border:0;border-radius:16px;font-weight:700;font-size:15px;cursor:pointer}
.cal-ok{background:var(--ok);color:#fff}
.cal-cancel{background:#eaf0fa;color:var(--text)}

/* settings / menu rows */
.opt-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:14px 16px;font-size:15px;cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--soft);color:var(--deep);font-weight:700}
.opt .tick{opacity:0;font-weight:700;font-size:17px}
.opt.on .tick{opacity:1}
.page-btns{display:flex;flex-direction:column;gap:12px;margin-top:16px}

/* long-press actions */
.lp-wrap{position:relative}
.lp-wrap.on .card{padding-left:124px}
.card.shaking,.lp-wrap.on .card{animation:wig .35s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.4deg)}75%{transform:rotate(1.4deg)}}
.lp-acts{position:absolute;left:12px;top:50%;transform:translateY(-50%);display:flex;gap:8px;z-index:2}
.lp-btn{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:var(--soft);color:var(--deep);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.lp-btn.txt{width:auto;padding:0 16px;border-radius:23px;font-size:14px;font-weight:700;font-family:inherit}
.lp-btn.del{background:#fdecea;color:var(--neg)}
.lp-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* add customer page */
.avatar-big{width:120px;height:120px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:12px auto 24px}
.avatar-big svg{width:56px;height:56px;stroke:var(--pri);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar-btn{position:relative;border:0;padding:0;cursor:pointer;overflow:hidden;display:grid;place-items:center;font-family:inherit;flex:none}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-btn .cam-badge{position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(20,30,45,.45);display:grid;place-items:center}
.avatar-btn .cam-badge svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av-img{padding:0;overflow:hidden;background:var(--soft)}
.av-img img{width:100%;height:100%;object-fit:cover;display:block}
.crop-wrap{display:flex;justify-content:center;margin-top:6px}
.crop-wrap canvas{width:260px;max-width:100%;height:auto;aspect-ratio:1/1;background:#eaf0fa;border-radius:16px;border:1px solid var(--line);touch-action:none;cursor:grab}
#crop-zoom{padding:0;height:28px}
.portal{position:fixed;inset:0;z-index:1000;background:var(--bg);overflow:auto;padding-bottom:40px}
.portal.hidden{display:none!important}
.pt-wrap{max-width:520px;margin:0 auto;padding:16px;position:relative}
.pt-menu{position:absolute;top:58px;right:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.15);padding:6px;z-index:5}
.pt-menu.hidden{display:none}
.pt-menu-b{border:0;background:none;color:var(--neg);font-weight:700;font-size:15px;padding:12px 16px;cursor:pointer;white-space:nowrap}
.pt-dots{font-size:26px;line-height:1;font-weight:700}
/* customer portal uses the same blue palette as the app's login screen */
.portal{--bg:#f3f6fa;--card:#fff;--text:#1f2937;--muted:#64748b;--pri:#26619c;--deep:#1b4a7a;--line:#dfe3ea;--soft:#e6edf8}
.portal .hero{background:linear-gradient(135deg,#3a72b0,#1b4a7a);box-shadow:0 10px 30px rgba(27,74,122,.25)}
.portal .bottom-btn{background:#26619c;box-shadow:0 10px 24px rgba(38,97,156,.3)}
.portal .pt-photo{background:#e6edf8;color:#1b4a7a}
.portal .fld{background:#fff}
.portal .fld:focus-within{border-color:#26619c;box-shadow:0 0 0 3px #d5e1f4}
.portal .pt-menu-b{color:#c0392b}
.pt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pt-top h1{font-size:19px;font-weight:700}
.pt-top .sp{width:42px;height:42px}
.pt-head{display:flex;flex-direction:column;align-items:center;gap:10px;margin:14px 0}
.pt-head b{font-size:18px}
.pt-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:40px;font-weight:700;color:var(--deep)}
.form-card{background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.fld{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:16px;padding:8px 14px;background:#f7fbfe}
.fld:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px #d5e1f4}
.fld .fi{width:22px;height:22px;flex:none;margin-top:14px}
.fld .fi svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fld .fw{flex:1;display:flex;flex-direction:column;min-width:0}
.fld label{font-size:12px;color:var(--muted);margin-top:4px}
.fld input,.fld textarea{border:0;background:transparent;padding:4px 0 8px;font-size:15px;width:100%;resize:none}
.fld input:focus,.fld textarea:focus{outline:none}
.fld textarea{min-height:48px}
.bottom-btn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:18px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 24px rgba(38,97,156,.3)}
.bottom-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.info{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.9;color:var(--text)}
.info span{color:var(--muted)}
.title-btn{border:0;background:none;font-size:19px;font-weight:700;color:var(--text);cursor:pointer;padding:8px 10px;border-radius:12px;max-width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{font-size:24px;line-height:1;color:var(--deep);margin-right:4px;vertical-align:middle}
.pick-row{display:flex;flex-direction:column;gap:8px;padding:4px 0 12px}
.pchip{display:flex;align-items:center;justify-content:flex-start;gap:12px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;font-size:15px;color:var(--text);width:100%;text-align:right}
.pchip.on{border-color:var(--pri);background:var(--soft);font-weight:700;color:var(--deep)}
.pchip.add{color:var(--deep);border-style:dashed}
.pchip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.pchip.on .rd{border-color:var(--ok)}
.pchip.on .rd::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ok)}
.pchip.on{border-color:var(--ok)}
.shaking,.lp-wrap.on > .hero{animation:wig .35s ease-in-out infinite}
.hero-acts{top:12px;left:12px;transform:none}
.pmore{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--deep);cursor:pointer;display:grid;place-items:center;z-index:2;font-size:18px;line-height:1;font-weight:700}
.lp-wrap.on .pmore{display:none}
.cust-wrap .card{padding-left:56px}
.cust-acts{flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:8px}
.cq-wrap{margin-top:10px}
.cm-btn{width:100%;justify-content:center;padding:16px;font-size:15px}
.tx-page{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.tx-page label{font-size:13px;color:var(--muted);margin-top:6px;display:block}
.tx-page .sub{margin:0}
.lp-wrap.on .pchip{padding-left:16px}
.p-acts{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:8px}
.pbtn{display:flex;align-items:center;gap:8px;padding:10px 18px;border:0;border-radius:14px;background:var(--soft);color:var(--deep);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.pbtn.sub{background:#fff;border:1px solid var(--line);margin-right:14px;min-width:150px;justify-content:space-between}
.pbtn .pk{color:var(--ok);font-weight:700}
.pbtn.del{background:#fdecea;color:var(--neg)}
.pbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* lock screen */
#lock{position:fixed;inset:0;z-index:50;background:#f3f6fa;color:#1f2937;display:flex;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
#lock.hidden{display:none}
#lock.lk-busy .pad,#lock.lk-busy .lk-dots{opacity:.35;pointer-events:none}
#lock.lk-busy::after{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border:4px solid rgba(31,41,55,.2);border-top-color:#2a63a0;border-radius:50%;animation:lkspin .7s linear infinite}
@keyframes lkspin{to{transform:rotate(360deg)}}
.lk-wrap{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;text-align:center}
.lk-ico{width:56px;height:56px;margin-bottom:22px}
.lk-ico svg{width:100%;height:100%;stroke:#64748b;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lk-title{font-size:18px;font-weight:700;color:#1f2937;margin-bottom:34px}
.lk-dots{display:flex;gap:22px;direction:ltr;margin-bottom:14px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #2a63a0;display:inline-block;box-sizing:border-box;transition:background .12s}
.dot.fill{background:#2a63a0}
.lk-dots.shake{animation:lkshake .35s}
@keyframes lkshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lk-msg{min-height:22px;font-size:14px;color:#c0392b;margin-bottom:18px;padding:0 6px}
.lk-msg.ok{color:#1e9e62;font-weight:700}
.lk-msg.busy{color:#2a63a0}
.pad{display:grid;grid-template-columns:repeat(3,76px);justify-content:space-between;gap:18px 0;width:100%;max-width:300px;direction:ltr}
.pk-key{width:76px;height:76px;border-radius:50%;border:1px solid #dfe3ea;background:#eef1f6;color:#1a2233;font-size:30px;font-weight:700;cursor:pointer;font-family:Poppins,Vazirmatn,sans-serif;display:grid;place-items:center;padding:0;-webkit-tap-highlight-color:transparent;transition:background .1s,transform .1s}
.pk-key:active{background:#dde3ec;transform:scale(.95)}
.pk-key svg{width:30px;height:30px;stroke:#64748b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pad .gap{width:76px;height:76px}
.su-wrap{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:right}
.su-wrap .lk-ico{align-self:center;margin-bottom:6px}
.su-h{font-size:22px;font-weight:700;text-align:center;margin:0}
.su-p{font-size:14px;color:#64748b;text-align:center;margin:0 0 10px}
.su-fld label{display:block;font-size:13px;color:#64748b;margin-bottom:6px}
.su-fld input{width:100%;height:54px;border:1.5px solid #dfe3ea;border-radius:16px;background:#fff;padding:0 16px;font-size:16px;font-family:inherit;color:#1f2937;outline:none}
.su-fld input:focus{border-color:#2a63a0}
.su-fld input.ltr{direction:ltr;text-align:left}
.su-btn{position:relative;width:100%;height:60px;border:0;border-radius:22px;background:#26619c;color:#fff;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px}
.su-btn svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.su-alt{text-align:center;font-size:14px;color:#64748b;margin-top:6px}
.lk-link{background:none;border:0;color:#2a63a0;cursor:pointer;font-size:14px;font-family:inherit;margin-top:26px}
.mail-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;width:100%}
.mail-txt{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.mail-txt b{font-size:15px}
.srow{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.srow-b{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-align:right}
.srow-out{margin-top:18px}
.st-page .sec-title{font-size:13px;color:var(--muted);margin-bottom:0}
.st-page .opt{padding:10px 14px}
.st-page .opt span{font-size:13px}
.st-page .opt .sub{font-size:12px}
.st-page .srow{gap:6px;margin-top:8px}
.st-page .srow-b{font-size:13px;padding:9px 12px}
.st-page .srow-out{margin-top:14px}
.st-page .ka-row{font-size:12px;margin-top:10px}
.st-page .ka-row b{font-size:12px}
.st-page .mail-row{padding:10px 12px}
.st-page .mail-txt b{font-size:13px}
.st-page .mail-txt small{font-size:12px}
.st-page .mail-ok{font-size:11px}
.ka-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:6px 6px 0;font-size:13px;color:var(--muted)}
.ka-row b{font-weight:600;color:var(--text)}
.ka-row .ka-v{direction:rtl;text-align:left}
.ka-row .ka-v.ok{color:var(--pos)}
.ka-row .ka-v.old{color:var(--neg)}
.mail-ok{display:inline-flex;align-items:center;gap:4px;flex:none;color:#1e7a4c;font-size:11px;font-weight:700;white-space:nowrap}
.mail-ok svg{width:14px;height:14px;stroke:#1e7a4c;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mail-txt small{color:var(--muted);font-size:13px;direction:ltr;text-align:left;overflow-wrap:anywhere;word-break:break-all;white-space:normal}
.dots-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--soft);color:var(--deep);font-size:20px;font-weight:700;cursor:pointer;flex:none;line-height:1}
.nb-row{padding:6px 12px;margin-bottom:6px;gap:8px}
.nb-row .lg-main{gap:1px}
.nb-row b{color:#1e78d2;line-height:1.4;font-size:17px}
.nb-row span,.nb-row p{line-height:1.5;margin:0;color:#1d2b5a}
.nb-row small{line-height:1.5;margin:0}
#f-nb:focus,#f-ns:focus{outline:none;box-shadow:none;border-color:var(--line)}
.sheet textarea,.sheet input{flex:0 0 auto !important;flex-shrink:0 !important}
#sheet textarea{height:130px !important;min-height:130px !important}
html,body{overscroll-behavior:none;overscroll-behavior-y:none}
.sheet,#sheet,#app{overscroll-behavior:contain}

/* صفحه‌های مشتری، طرف حساب و دخل و خرج: بالای صفحه (هدر و خلاصه) ثابت می‌ماند و فقط فهرست تراکنش‌ها بالا و پایین می‌رود */
body:has(#main > .list), body:has(#main > .lg-scroll), body:has(#main > #nbRows){overflow:hidden;height:100%}
#main:has(> .list), #main:has(> .lg-scroll), #main:has(> #nbRows){
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}
#main > *:not(.list):not(.lg-scroll):not(#nbRows){flex:0 0 auto}
#main > .list, #main > .lg-scroll, #main > #nbRows{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:120px}

/* هدر فشرده‌تر، ولی هنوز خوانا */
.top{padding:10px 4px 6px}
.top h1,.top .title-btn{font-size:20px}
.top .sp,.top .ic{width:42px;height:42px}
.top .ic svg{width:24px;height:24px}
.top .dots{font-size:26px}

/* بخش ثابت بالا فشرده‌تر */
#main:has(> .list) > .hero, #main:has(> .lg-scroll) > .cb-hero, #main:has(> .list) .hero{padding:12px 14px !important;border-radius:18px !important}
#main:has(> .list) .hero .net{font-size:22px !important;margin:4px 0 6px !important}
#main:has(> .list) .hero .lbl{font-size:12px !important}
#main:has(> .lg-scroll) .cb-hero{padding:12px 16px !important;border-radius:18px !important;margin:0 0 10px !important}
#main:has(> .lg-scroll) .cb-net{font-size:26px !important;margin:4px 0 8px !important}
#main:has(> .lg-scroll) .cb-card{padding:8px 12px !important}
#main:has(> .lg-scroll) .cb-card b{font-size:14px !important}
#main:has(> .list) .info{padding:8px 12px !important;font-size:13px !important;line-height:1.6 !important;margin-top:8px !important}
#main:has(> .list) .sec-title{margin:10px 4px 0 !important;font-size:14px !important}
#main:has(> .list) .search{margin-top:8px}
#main:has(> .lg-scroll) .lg-bar{margin:8px 0 0 !important}
#main:has(> .lg-scroll) .sec-row{margin:8px 4px 4px !important}
/* صفحه طرف حساب‌ها: خلاصه‌ی بالا فشرده‌تر */
#main:has(> .list) .hero{padding:10px 12px !important;border-radius:16px !important}
#main:has(> .list) .hero .lbl{font-size:11px !important}
#main:has(> .list) .hero .net{font-size:19px !important;margin:2px 0 4px !important}
#main:has(> .list) .hero .mini-row{gap:6px !important}
#main:has(> .list) .hero .mini{padding:6px 8px !important;border-radius:12px !important}
#main:has(> .list) .hero .mini span{font-size:10px !important}
#main:has(> .list) .hero .mini b{font-size:13px !important;margin-top:2px !important}
/* صفحه طرف حساب‌ها: دکمه‌ها، عنوان مشتریان و جستجو فشرده‌تر تا فضای بیشتری برای فهرست مشتریان بماند */
#main:has(> .list) > .opt-list{margin:6px 0 !important;gap:6px !important}
#main:has(> .list) .opt{padding:8px 12px !important;font-size:13px !important;border-radius:12px !important}
#main:has(> .list) > .sec-row{margin:6px 4px 4px !important}
#main:has(> .list) .sec-title{font-size:14px !important;margin:0 !important}
#main:has(> .list) .live-btn{padding:5px 12px !important;font-size:12px !important}
#main:has(> .list) > .cq-wrap{margin:2px 0 6px !important}
#main:has(> .list) .cq-wrap input{padding:7px 12px !important;font-size:13px !important;border-radius:12px !important}

/* اصلاحات: فاصله تراکنش‌ها از کارت شماره تلفن، و فشرده‌سازی قالب بالای صفحه مشتری (مثل طرف حساب‌ها) */
#main:has(> .list) > .list{margin-top:18px !important}
#main:has(> .list) .sec-title{margin-bottom:2px !important}
#main:has(> .list) .mini-row{gap:8px !important}
#main:has(> .list) .mini{padding:7px 10px !important;border-radius:12px !important}
#main:has(> .list) .mini span{font-size:11px !important}
#main:has(> .list) .mini b{font-size:13px !important;margin-top:3px !important}
#main:has(> .list) .hero .net{margin:2px 0 6px !important}
#main:has(> .list) .tx-card{padding-right:18px !important}

/* صورت حساب زنده: بالای صفحه ثابت و فشرده؛ فقط فهرست تراکنش‌ها حرکت می‌کند */
.portal:has(.pt-stmt){overflow:hidden;padding-bottom:0;display:flex;flex-direction:column}
.pt-stmt{flex:1 1 auto;min-height:0;height:100%;display:flex;flex-direction:column;padding:10px 14px 0;box-sizing:border-box;width:100%}
.pt-stmt > *:not(.pt-list){flex:0 0 auto}
.pt-stmt .pt-top{margin-bottom:2px}
.pt-stmt .pt-top h1{font-size:17px}
.pt-stmt .pt-top .ic{width:36px;height:36px}
.pt-stmt .pt-head{margin:2px 0 4px;gap:4px}
.pt-stmt .pt-head b{font-size:14px}
.pt-stmt .pt-photo{width:44px;height:44px;font-size:20px}
.pt-stmt .hint{margin:2px 0}
.pt-stmt .hero{padding:10px 12px !important;border-radius:16px !important;margin:0 !important}
.pt-stmt .hero .lbl{font-size:11px !important}
.pt-stmt .hero .net{font-size:22px !important;margin:2px 0 6px !important}
.pt-stmt .mini-row{gap:8px}
.pt-stmt .mini{padding:7px 10px;border-radius:12px}
.pt-stmt .mini span{font-size:11px}
.pt-stmt .mini b{font-size:13px;margin-top:3px}
.pt-stmt .sec-title{margin:18px 4px 4px;font-size:14px;font-weight:700}
.pt-list{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));margin-top:0 !important}
/* فاصله تراکنش‌ها از کارت شماره تلفن در صفحه مشتری داخل برنامه */
#main:has(> .list) .sec-title{margin-top:24px !important}

/* فهرست طرف حساب‌ها: فضای کافی پایین تا دکمه شناور روی ⋮ مشتری آخر نیفتد */
#main:has(> .list) > .list{padding-bottom:170px !important}

/* دکمه شناور «افزودن مشتری»: فهرست زیر آن یک نوار محو دارد، پس سه‌نقطه‌ی مشتری‌ها زیر دکمه محو می‌شود و روی آن نمی‌ماند */
#main:has(> .list)::after{content:"";position:fixed;left:0;right:0;bottom:0;height:110px;background:linear-gradient(to top,var(--bg) 55%,rgba(243,246,250,0));pointer-events:none;z-index:4}
.fab{z-index:5}

/* طرف حساب‌ها: جستجوی مشتری بالاتر (نزدیک دخل و خرج)، کمی به چپ، و عنوان «مشتریان» داخل قالب جستجو در ابتدا */
.cq-wrap{position:relative;display:flex;align-items:center;margin:0 0 10px;padding-left:24px;padding-right:4px}
.cq-wrap input{flex:1;min-width:0}
.cq-lbl{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;margin-left:10px;margin-right:4px}
#main:has(> .list) .cq-wrap{margin:0 0 6px;padding-left:24px}
#main:has(> .list) .sec-title{display:none}

/* قالب جستجوی مشتری: بزرگ‌تر، و لبه‌ی راست و چپش دقیقاً با قالب دخل و خرج شخصی یکی است */
#main:has(> .list) .cq-wrap{margin:0 0 10px !important;padding:0 !important;width:100%;display:flex;align-items:center;gap:8px}
#main:has(> .list) .cq-wrap input{padding:15px 16px !important;font-size:16px !important;min-height:54px;border-radius:16px !important}
#main:has(> .list) .cq-lbl{font-size:16px !important;margin:0 4px 0 0 !important;padding-right:4px}
/* قالب جستجوی شرح مبلغ در صفحه مشتری: هم‌اندازه‌ی قالب جستجوی مشتریان */
#main:has(> .list) .txq-inp{flex:1 1 auto;width:auto;min-width:0;height:46px;min-height:46px;padding:0 10px !important;font-size:13px !important;text-overflow:ellipsis;box-sizing:border-box;border:1.5px solid var(--pri) !important;border-radius:16px !important}
#main:has(> .list) .txq-inp::placeholder{font-size:13px;white-space:nowrap;overflow:visible}
/* وقت لمس قالب جستجو، خط اضافه دور آن ظاهر نشود */
#main:has(> .list) .txq-inp:focus,#main:has(> .list) .txq-inp:focus-visible{outline:none !important;box-shadow:none !important;-webkit-appearance:none;appearance:none}

/* دکمهٔ کوچک داخل قالب جستجوی مشتری: تغییر کیبورد بین متنی و عددی */
#main:has(> .list) .cq-field{position:relative;flex:1;min-width:0;display:flex}
#main:has(> .list) .cq-field input{flex:1;min-width:0;padding-left:64px !important}
.cq-mode{position:absolute;left:8px;top:50%;transform:translateY(-50%);height:36px;min-width:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--deep);font-size:14px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit}
.cq-mode:active{background:var(--line)}

/* فهرست مشتریان بالا می‌رود و درست از زیر قالب جستجو رد می‌شود؛ عنوان «مشتریان» هم قالب کوچک خودش را دارد */
#main:has(> .list) > .list{margin-top:0 !important;padding-top:0 !important}
#main:has(> .list) .cq-wrap{margin:0 0 6px !important}
#main:has(> .list) .cq-lbl{display:inline-flex;align-items:center;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px !important;font-weight:700;color:var(--deep);margin:0 !important;line-height:1}

/* «مشتریان» در قالبی هم‌اندازه‌ی قالب جستجو و جدا از آن؛ متن جستجو کامل دیده می‌شود */
#main:has(> .list) .cq-wrap{gap:10px !important;align-items:stretch !important;margin:0 0 8px !important}
#main:has(> .list) .cq-lbl{width:104px;min-height:54px;height:54px;border-radius:16px !important;font-size:15px !important;padding:0 10px !important;justify-content:center;box-sizing:border-box}
#main:has(> .list) .cq-wrap input{flex:1 1 auto;width:auto !important;min-width:0;height:54px;min-height:54px !important;padding:0 14px !important;font-size:14px !important;box-sizing:border-box;border-radius:16px !important}
#main:has(> .list) .cq-wrap input::placeholder{font-size:14px}

/* ردیف مشتریان: نام و مبلغ کوچک‌تر تا نام کامل‌تر دیده شود */
#main:has(> .list) .cust-wrap .card .nm b{font-size:13px !important;max-width:100%}
#main:has(> .list) .cust-wrap .card .nm small{font-size:11px !important}
#main:has(> .list) .cust-wrap .card .bal{font-size:12px !important}
#main:has(> .list) .cust-wrap .card .bal-note{font-size:11px !important;font-weight:700 !important;color:#1e293b !important}
#main:has(> .list) .cust-wrap .card{gap:8px}

/* قالب «دخل و خرج شخصی»: بدون خط اطراف، رنگ یکدست با برنامه، متن درشت‌تر و فلش بزرگ‌تر */
#main .opt.ledger-open{border:0 !important;outline:none !important;background:var(--soft) !important;color:var(--deep) !important;font-size:17px !important;font-weight:700 !important;padding:16px 18px !important;border-radius:16px !important;box-shadow:none}
#main .opt.ledger-open:focus,#main .opt.ledger-open:focus-visible{outline:none !important}
#main .opt.ledger-open .sub svg{width:26px !important;height:26px !important;stroke:var(--pri) !important;stroke-width:2.6 !important}
/* فشرده‌سازی قالب دخل و خرج شخصی، و نزدیک‌تر کردن قالب جستجو و «مشتریان» تا جای بیشتری برای ردیف مشتریان بماند */
#main .opt.ledger-open{padding:11px 14px !important;font-size:16px !important;border-radius:14px !important}
#main .opt.ledger-open .sub svg{width:22px !important;height:22px !important}
#main:has(> .list) > .opt-list{margin:2px 0 8px !important}
#main:has(> .list) .cq-wrap{margin:0 0 4px !important;gap:8px !important}
#main:has(> .list) .cq-lbl{width:92px;min-height:46px;height:46px;font-size:14px !important}
#main:has(> .list) .cq-wrap input{height:46px;min-height:46px !important;padding:0 12px !important;font-size:14px !important;border-radius:14px !important}
#main:has(> .list) > .list{margin-top:0 !important;padding-top:0 !important}
/* «مشتریان»: همان رنگ و خط اطراف و متن قالب جستجو */
#main:has(> .list) .cq-lbl{background:#fff !important;border:1px solid var(--line) !important;border-radius:14px !important;color:var(--text) !important;font-weight:700 !important;box-sizing:border-box}
/* دور قالب جستجوی مشتری و «مشتریان» به رنگ اصلی برنامه؛ داخل قالب‌ها بدون تغییر */
#main:has(> .list) .cq-lbl{border-color:var(--pri) !important;border-width:1.5px !important}
#main:has(> .list) .cq-wrap input#cq{border:1.5px solid var(--pri) !important}
/* خط دور قالب «دخل و خرج شخصی» به رنگ اصلی برنامه */
#main .opt.ledger-open{border:1.5px solid var(--pri) !important}
.lg-acts-one{display:flex;gap:10px;margin-top:14px}
.lg-acts-one button{flex:1}
.arch-hd{border:1.5px solid var(--pri);background:#fff;color:var(--text);border-radius:16px;padding:8px 16px;line-height:1.3;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;white-space:nowrap;flex:none}
.arch-lbl{display:flex;align-items:center;justify-content:center;border:1.5px solid var(--pri);background:#fff;color:var(--text);border-radius:16px;padding:14px 16px;margin:12px 0 6px;font-weight:700;font-size:16px;min-height:54px}
.lg-cur-list{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.lg-cur-row{display:flex;align-items:center;gap:12px;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:12px 20px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
.lg-cur-row.on{border-color:#16a34a}
.lg-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--pri);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex:none}
.lg-cur-row.on .lg-dot{background:#16a34a;border-color:#16a34a}
</style>
</head>
<body>
<div id="main"></div>

<div id="ov" class="overlay hidden">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div id="cal" class="overlay cal-ov hidden" role="dialog" aria-modal="true"></div>
<div id="lock" class="hidden"></div>

    const { error } = await supabaseClient.from('s').upsert(row, { onConflict:'u' });
    if(error){ console.warn('settings sync:', error); return; }
    SET_LAST_KEY = settingsKey(); SET_PENDING = false;
  }catch(e){ console.warn('settings sync:', e); }
}
function queueSettingsSync(){
  if(!cloudReady || !cloudUser || !supabaseClient) return;
  if(settingsKey() === SET_LAST_KEY) return;
  SET_PENDING = true;
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(settingsSyncNow, 500);
}
async function settingsLoad(){
  if(!supabaseClient || !cloudUser) return;
  const { data, error } = await supabaseClient.from('s').select('lgcur,arc').eq('u', cloudUser.id).maybeSingle();
  if(error) throw error;
  if(data && !SET_PENDING){
    S.archIds = Array.isArray(data.arc) ? data.arc : [];
    S.lgCur = data.lgcur || 'toman';
    SET_LAST_KEY = settingsKey();
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  }else{
    /* بار اول: تنظیمات همین گوشی به ابر فرستاده می‌شود */
    await settingsSyncNow();
  }
}

/* تنظیمات بایگانی و واحد مبلغ را از سرور می‌گیرد؛ وقتی برنامه دوباره فعال یا آنلاین شود و در حالت عادی با اتصال زنده به‌روز می‌شود */
async function settingsPoll(){
  if(!cloudUser || !supabaseClient || !cloudReady || !navigator.onLine || LK.locked) return;
  try{
    if(settingsKey() !== SET_LAST_KEY) SET_PENDING = true;
    if(SET_PENDING){ await settingsSyncNow(); return; }
    const before = settingsKey();
    await settingsLoad();
    if(settingsKey() !== before && !liveUIBusy()) render();
  }catch(e){ console.warn('settings poll:', e); }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) settingsPoll(); });
window.addEventListener('online', () => setTimeout(settingsPoll, 800));

async function cloudLoad(){
  if(!supabaseClient || !cloudUser) throw new Error('اتصال حساب ابری برقرار نیست.');
  nbUseUser();
  const u = cloudUser.id;
  const [pr, cr, tr, lr] = await Promise.all([
    supabaseClient.from('p').select('id,n,cur').eq('u',u),
    supabaseClient.from('c').select('id,p,n,ph,ds,pf,ac').eq('u',u),
    supabaseClient.from('t').select('id,c,a,d,y,m,dd,ts,hh,mm').eq('u',u),
    supabaseClient.from('l').select('id,ty,a,d,y,m,dd,ts,hh,mm').eq('u',u)
  ]);
  if(pr.error) throw pr.error;
  if(cr.error) throw cr.error;
  if(tr.error) throw tr.error;
  const parties = (pr.data || []).map(p => ({
    id:p.id, n:p.n || '', cur:p.cur || 'toman', c:[]
  }));
  const pmap = new Map(parties.map(p => [p.id,p]));
  const cmap = new Map();
  (cr.data || []).forEach(c => {
    const parent = pmap.get(c.p);
    if(!parent) return;
    const item = { id:c.id, n:c.n || '', ph:c.ph || '', ds:c.ds || '', pf:c.pf || '', ac:c.ac || '', tx:[] };
    parent.c.push(item); cmap.set(item.id,item);
  });
  (tr.data || []).forEach(t => {
    const customer = cmap.get(t.c);
    if(!customer) return;
    customer.tx.push({ id:t.id, a:Number(t.a)||0, d:t.d||'', y:Number(t.y)||0,
      m:Number(t.m)||1, dd:Number(t.dd)||1, ts:Number(t.ts)||0, hh: t.hh == null ? undefined : Number(t.hh), mm: t.mm == null ? undefined : Number(t.mm) });
  });
  /* دفتر دخل و خرج: اگر جدول آنلاین آماده نبود، نسخهٔ داخل گوشی دست نمی‌خورد */
  let ledger = Array.isArray(S.ledger) ? S.ledger : [];
  if(lr.error){ ledgerCloudOk = false; console.warn('ledger table unavailable:', lr.error); }
  else{
    ledgerCloudOk = true;
    if((lr.data || []).length){
      ledger = lr.data.map(r => ({ id:r.id, type:r.ty === 'out' ? 'out' : 'in', a:Number(r.a)||0, d:r.d||'',
        y:Number(r.y)||0, m:Number(r.m)||1, dd:Number(r.dd)||1, ts:Number(r.ts)||0,
        hh: r.hh == null ? null : Number(r.hh), mm: r.mm == null ? null : Number(r.mm) }));
    }
  }
  /* ترتیب قبلی طرف حساب‌ها و مشتری‌ها را نگه می‌داریم؛ دیتابیس ترتیب ثابتی برنمی‌گرداند و بدون این، مشتری‌ها جابه‌جا می‌شدند */
  const _pOld = new Map((S.parties || []).map((p, i) => [p.id, i]));
  const _pRank = id => _pOld.has(id) ? _pOld.get(id) : 1e9;
  parties.sort((a, b) => _pRank(a.id) - _pRank(b.id));
  parties.forEach(p => {
    const oldP = (S.parties || []).find(x => x.id === p.id);
    const _cOld = new Map(((oldP && oldP.c) || []).map((c, i) => [c.id, i]));
    const _cRank = id => _cOld.has(id) ? _cOld.get(id) : 1e9;
    p.c.sort((a, b) => _cRank(a.id) - _cRank(b.id));
  });
  try{ await settingsLoad(); }catch(e){ console.warn('settings load:', e); }
  S = { ...S, cur:S.cur || 'toman', parties, ledger, email:cloudUser.email || S.email || '', loggedIn:true };
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
}

async function cloudSyncNow(){
  if(!supabaseClient || !cloudUser) return;
  if(cloudSyncing){ cloudSyncAgain = true; return; }
  cloudSyncing = true;
  try{
    do{
      cloudSyncAgain = false;
      const u = cloudUser.id;
      const parties = S.parties || [];
      const customers = parties.flatMap(p => (p.c || []).map(c => ({ p, c })));
      const transactions = customers.flatMap(x => (x.c.tx || []).map(t => ({ c:x.c, t })));
      const pRows = parties.map(p => ({ id:String(p.id), u, n:p.n || '', cur:p.cur || 'toman' }));
      const cRows = customers.map(x => ({ id:String(x.c.id), u, p:String(x.p.id), n:x.c.n || '', ph:x.c.ph || '', ds:x.c.ds || '', pf:x.c.pf || null, ac:x.c.ac || null }));
      const tRows = transactions.map(x => ({ id:String(x.t.id), u, c:String(x.c.id), a:Math.trunc(Number(x.t.a)||0), d:x.t.d || '', y:Math.trunc(Number(x.t.y)||0), m:Math.trunc(Number(x.t.m)||1), dd:Math.trunc(Number(x.t.dd)||1), ts:Math.trunc(Number(x.t.ts)||0), hh: x.t.hh == null ? null : Math.trunc(Number(x.t.hh)), mm: x.t.mm == null ? null : Math.trunc(Number(x.t.mm)) }));
      for(const [table, rows] of [['p',pRows],['c',cRows],['t',tRows]]){
        if(rows.length){
          const {error} = await supabaseClient.from(table).upsert(rows, { onConflict:'id' });
          if(error) throw error;
        }
      }
      async function deleteMissing(table, rows){
        let q = supabaseClient.from(table).delete().eq('u',u);
        if(rows.length) q = q.not('id','in',`(${rows.map(r => String(r.id)).join(',')})`);
        const {error} = await q;
        if(error) throw error;
      }
      await deleteMissing('t', tRows);
      await deleteMissing('c', cRows);
      await deleteMissing('p', pRows);
      /* دفتر دخل و خرج (جدول l) — اگر خطا داد، بقیهٔ اطلاعات همچنان همگام می‌شود */
      if(!ledgerCloudOk){
        const pr = await supabaseClient.from('l').select('id,ty,a,d,y,m,dd,ts,hh,mm').eq('u',u);
        if(pr.error){
          lastLedgerErr = pr.error.message || String(pr.error.code || 'error');
          if(ledgerStrict) throw pr.error;
        }else{
          const have = new Set((S.ledger || []).map(x => String(x.id)));
          (pr.data || []).forEach(r => { if(!have.has(String(r.id))) (S.ledger = S.ledger || []).push({ id:r.id, type:r.ty === 'out' ? 'out' : 'in', a:Number(r.a)||0, d:r.d||'', y:Number(r.y)||0, m:Number(r.m)||1, dd:Number(r.dd)||1, ts:Number(r.ts)||0, hh:r.hh == null ? null : Number(r.hh), mm:r.mm == null ? null : Number(r.mm) }); });
          ledgerCloudOk = true;
        }
      }
      if(ledgerCloudOk){
        try{
          const lRows = (S.ledger || []).map(x => ({ id:String(x.id), u, ty:x.type === 'out' ? 'out' : 'in', a:Math.trunc(Number(x.a)||0), d:x.d || '',
            y:Math.trunc(Number(x.y)||0), m:Math.trunc(Number(x.m)||1), dd:Math.trunc(Number(x.dd)||1), ts:Math.trunc(Number(x.ts)||0),
            hh: x.hh == null ? null : Math.trunc(Number(x.hh)), mm: x.mm == null ? null : Math.trunc(Number(x.mm)) }));
          if(lRows.length){
            const {error} = await supabaseClient.from('l').upsert(lRows, { onConflict:'id' });
            if(error) throw error;
          }
          await deleteMissing('l', lRows);
        }catch(e){
          console.error('Ledger sync error:', e);
          lastLedgerErr = (e && e.message) || String(e);
          if(ledgerStrict) throw e;
          if(!ledgerWarned){ ledgerWarned = true; showToast('دخل و خرج آنلاین ذخیره نشد؛ جدول l را در Supabase بسازید.'); }
        }
      }
    }while(cloudSyncAgain);
  }catch(e){ console.error('Supabase sync error:', e); return false; }
  finally{ cloudSyncing = false; }
  return true;
}
function queueCloudSync(){
  if(!cloudReady || !cloudUser) return;
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(() => { cloudSyncNow().catch(e => console.error(e)); }, 500);
}

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function latin(s){
  return String(s)
    .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function parse(v){ return parseInt(latin(v).replace(/[^0-9]/g,'') || '0', 10); }
function fa(n){ return String(n).replace(/\d/g, x => '۰۱۲۳۴۵۶۷۸۹'[x]); }
function p2(n){ return (n < 10 ? '0' : '') + n; }
function num(n){ return Math.abs(n).toLocaleString('en-US'); }
const CURS = { toman:'تومان', afn:'افغانی' };
function pcur(p){ return (p && CURS[p.cur]) ? p.cur : 'toman'; }
function curKey(){ const p = (typeof findParty === 'function') ? findParty(V.openId) : null; return (p && p.cur) || S.cur || 'toman'; }
function curLabel(){ return CURS[curKey()] || 'تومان'; }
function money(n){ return num(n) + ' ' + curLabel(); }
function lgCurKey(){ return (S.lgCur && CURS[S.lgCur]) ? S.lgCur : 'toman'; }
function lgMoney(n){ return num(n) + ' ' + CURS[lgCurKey()]; }
function signed(n){ return n > 0 ? '+' + money(n) : n < 0 ? '−' + money(n) : '-'; }
/* balance colors: positive (customer owes us) red, negative (customer has a claim) green */
function cls(n){ return n > 0 ? 'neg' : n < 0 ? 'pos' : 'zero'; }
/* balances: positive = I have a claim (dark green); negative = customer has a claim (red) */
function balCls(n){ return n > 0 ? 'bpos' : n < 0 ? 'bneg' : 'zero'; }
function tally(balances){
  let pos = 0, neg = 0;
  balances.forEach(b => { if(b > 0) pos += b; else neg += -b; });
  return { pos, neg, net: pos - neg };
}
/* totals over all transactions of the given customers:
   pos = everything I paid/gave to customers, neg = everything I received from customers, net = pos - neg */
function tallyC(custs){
  let pos = 0, neg = 0;
  /* مشتری‌های بایگانی‌شده در مجموع حساب حساب نمی‌شوند */
  custs.filter(c => !isArch(c)).forEach(c => c.tx.forEach(t => { if(t.a > 0) pos += t.a; else neg += -t.a; }));
  return { pos, neg, net: pos - neg };
}

}

/* Jalali (Persian solar) calendar */
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gdm[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){ jy += Math.floor((days-1)/365); days = (days-1) % 365; }
  let jm, jd;
  if(days < 186){ jm = 1 + Math.floor(days/31); jd = 1 + (days % 31); }
  else { jm = 7 + Math.floor((days-186)/30); jd = 1 + ((days-186) % 30); }
  return [jy, jm, jd];
}
function isLeap(y){ return [1,5,9,13,17,22,26,30].includes(((y % 33) + 33) % 33); }
function daysIn(y, m){ return m <= 6 ? 31 : m <= 11 ? 30 : (isLeap(y) ? 30 : 29); }
function jToDate(y, m, d){
  let base = null;
  for(let k = 19; k <= 22; k++){
    const x = new Date(y + 621, 2, k);
    const [jy, jm, jd] = g2j(x.getFullYear(), x.getMonth()+1, x.getDate());
    if(jy === y && jm === 1 && jd === 1){ base = x; break; }
  }
  if(!base) base = new Date(y + 621, 2, 21);
  const off = m <= 6 ? (m-1)*31 : 186 + (m-7)*30;
  return new Date(base.getFullYear(), base.getMonth(), base.getDate() + off + d - 1);
}
function today(){
  const d = new Date();
  const [y, m, dd] = g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
  return { y, m, d: dd };
}
function jStr(y, m, d){ return String(y) + '/' + p2(m) + '/' + p2(d); }
function parseDate(s){
  const parts = latin(s).trim().split(/[\/\-\.]/).map(x => parseInt(x, 10));
  if(parts.length !== 3 || parts.some(x => isNaN(x))) return null;
  const [y, m, d] = parts;
  if(y < 1300 || y > 1500 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  return { y, m, d };
}
function kOf(t){ return t.y*10000 + t.m*100 + t.dd; }
function sortTx(tx){ return [...tx].sort((a, b) => (kOf(b) - kOf(a)) || (b.ts - a.ts)); }
/* when the ⋮ of one transaction is tapped, only that transaction is listed */
function txList(c){
  const sorted = sortTx(c.tx);
  if(LPSEL && LPSEL.kind === 'txmode' && LPSEL.cid === c.id){
    return sorted.filter(t => t.id === LPSEL.tid);
  }
  return sorted;
}
/* جستجوی شرح مبلغ: بی‌توجه به ی/ک عربی، فاصله و بزرگی حروف لاتین */
function txNorm(s){
  return String(s == null ? '' : s).toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim();
}
function txFiltered(c){
  const q = txNorm(TXQ);
  const fr = lgKey(CF.from), to = lgKey(CF.to);
  return txList(c).filter(t => {
    if(q && !txNorm(t.d).includes(q)) return false;
    if(CF.type === 'pay' && !(t.a < 0)) return false;
    if(CF.type === 'get' && !(t.a > 0)) return false;
    const k = t.y * 10000 + t.m * 100 + t.dd;
    if(fr !== null && k < fr) return false;
    if(to !== null && k > to) return false;
    return true;
  });
}

let AC = null;
function softTone(f1, f2, dur, wave){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    const t = AC.currentTime;
    o.type = wave;
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}
function playBell(){
  if(S.snSave === false) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    [[880,1],[1760,0.5],[2637,0.25],[3520,0.12]].forEach(([f,a]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.01*a, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      o.connect(g); g.connect(AC.destination);
      o.start(t); o.stop(t + 1.25);
    });
  }catch(e){}
}

(function autoUpdate(){
  const KEY = 'hesab-build';
  const url = location.href.split('#')[0];
  function busy(){
    const ov = document.getElementById('ov');
    if(ov && !ov.classList.contains('hidden')) return true;
    const a = document.activeElement;
    if(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return true;
    return false;
  }
  async function buildId(){
    try{
      const r = await fetch(url, { method:'HEAD', cache:'no-store' });
      return r.headers.get('etag') || r.headers.get('last-modified') || '';
    }catch(e){ return ''; }
  }
  function resumeAndReload(){
    sessionStorage.setItem('hesab-resume', JSON.stringify({
      view:V.view, openId:V.openId, custId:V.custId, search:V.search, q:V.q, NBCUR:NBCUR, NBPICK:NBPICK
    }));
    location.reload();
  }
  let waiting = false;
  async function check(){
    if(!navigator.onLine) return;
    const b = await buildId();
    if(!b) return;
    const saved = localStorage.getItem(KEY);
    if(!saved){ localStorage.setItem(KEY, b); return; }
    if(saved === b) return;
    if(busy()){
      if(!waiting){
        waiting = true;
        const t = setInterval(() => { if(!busy()){ clearInterval(t); waiting = false; check(); } }, 3000);
      }
      return;
    }
    localStorage.setItem(KEY, b);
    resumeAndReload();
  }
  setTimeout(check, 4000);
  setInterval(check, 60000);
  window.addEventListener('online', () => setTimeout(check, 1500));
  document.addEventListener('visibilitychange', () => { if(!document.hidden) check(); });
})();
/* وقتی برنامه دوباره فعال می‌شود و دفترچه‌ای باز بوده، همان دفترچه را نشان می‌دهد */

/* PDF مستقیم ساخته می‌شود (بدون پنجرهٔ چاپ): همان گزارش تصویری داخل یک فایل PDF */
function jpegToPdf(jpgBytes, pw, ph, iw, ih){
  const enc = new TextEncoder(); const chunks = []; let len = 0; const offs = [];
  const push = u => { chunks.push(u); len += u.length; };
  const str = s => push(enc.encode(s));
  const obj = (n, body) => { offs[n] = len; str(`${n} 0 obj\n${body}\nendobj\n`); };
  str('%PDF-1.4\n');
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4] = len;
  str(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpgBytes.length} >>\nstream\n`);
  push(jpgBytes); str('\nendstream\nendobj\n');
  const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(5, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  const xref = len;
  str('xref\n0 6\n0000000000 65535 f \n');
  for(let i = 1; i <= 5; i++) str(`${String(offs[i]).padStart(10, '0')} 00000 n \n`);
  str(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks, { type: 'application/pdf' });
}

function fitText(x, text, cx, y, max, size, font, bold){
  let sz = size;
  do{ x.font = `${bold ? 'bold ' : ''}${sz}px ${font}`; sz--; }while(x.measureText(text).width > max && sz > 8);
  x.fillText(text, cx, y);
}
function wrapCanvasLines(mx, text, maxW){
  const out = [];
  String(text).split(/\r?\n/).forEach(para => {
    let line = '';
    para.split(/\s+/).filter(Boolean).forEach(w0 => {
      let w = w0;
      while(mx.measureText(w).width > maxW){
        let k = w.length;
        while(k > 1 && mx.measureText(w.slice(0, k)).width > maxW) k--;
        if(line){ out.push(line); line = ''; }
        out.push(w.slice(0, k)); w = w.slice(k);
      }
      const t = line ? line + ' ' + w : w;
      if(line && mx.measureText(t).width > maxW){ out.push(line); line = w; } else line = t;
    });
    out.push(line);
  });
  return out.length ? out : [''];
}

let EM = { newMail:'', code:'' };
const mailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function makeCode(){ return String(Math.floor(1000 + Math.random() * 9000)); }
/* returns 'auto' when the code was sent by the service, or 'mail' when the mail app was opened */
async function sendCode(to, code, purpose){
  if(MAIL_CFG.service && MAIL_CFG.template && MAIL_CFG.publicKey){
    const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: MAIL_CFG.service,
        template_id: MAIL_CFG.template,
        user_id: MAIL_CFG.publicKey,
        template_params: { to_email: to, code: code, purpose: purpose }
      })
    });
    if(!r.ok) throw new Error('mail failed');
    return 'auto';
  }
  const a = document.createElement('a');
  a.href = `mailto:${to}?subject=${encodeURIComponent(purpose)}&body=${encodeURIComponent(purpose + ': ' + code)}`;
  a.click();
  return 'mail';
}
async function emailSend(){
  const v = val('f-mail').trim();
  if(!mailOk(v)){ alert('ایمیل معتبر وارد کنید.'); return; }
  if(S.email && v.toLowerCase() === S.email.toLowerCase()){ alert('این ایمیل همان ایمیل فعلی است.'); return; }
  if(!supabaseClient || !cloudUser){ alert('ابتدا وارد حساب شوید.'); return; }
  const { error } = await supabaseClient.auth.updateUser({ email:v });
  if(error){ alert('درخواست تغییر ایمیل انجام نشد. دوباره تلاش کنید.'); return; }
  alert('درخواست تغییر ایمیل ثبت شد. لینک تأیید را از ایمیل جدید باز کنید.');
  closeSheet();
}

function lkUnlock(){
  startLive();
  try{ sessionStorage.setItem('hisab_unlocked', '1'); }catch(e){}
  LK.locked = false; LK.buf = ''; LK.err = ''; LK.showPad = false; LK.fromSettings = false;
  renderLock(); soundForward(); render();
}
async function lkOk(){
  const max = lkMax();
  if(LK.buf.length < max){ LK.err = `رمز ${fa(max)} رقمی را کامل کنید.`; renderLock(); return; }
  if(LK.mode === 'unlock'){
    if(LK.buf === S.pin){
      if(cloudUser){ lkUnlock(); refreshCloudQuiet(); return; }
      if(S.loggedIn && (!supabaseClient || !navigator.onLine)){ lkUnlock(); return; }
      LK.mode = 'login'; LK.f.mail = ''; LK.f.pass = ''; LK.buf = '';
      LK.err = 'نشست حساب ابری پایان یافته است. با ایمیل و رمز حساب وارد شوید.';
      renderLock(); return;
    }
    LK.err = 'رمز اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'verify'){
    const mail = LK.purpose === 'signup' ? LK.pend?.mail : LK.f.mail;
    const type = LK.purpose === 'signup' ? 'signup' : 'recovery';
    const { data, error } = await supabaseClient.auth.verifyOtp({ email:mail, token:LK.buf, type });
    if(error){ LK.err = 'کُد نادرست یا منقضی شده است. دوباره تلاش کنید.'; LK.buf = ''; LK.shake = true; renderLock(); return; }
    LK.buf = ''; LK.err = ''; cloudUser = data.user || data.session?.user || null;
    if(!cloudUser){ LK.err = 'تأیید انجام شد، اما حساب کاربری دریافت نشد. دوباره وارد شوید.'; LK.mode = 'login'; renderLock(); return; }
    if(LK.purpose === 'signup'){
      S.email = cloudUser.email || mail; S.loggedIn = true;
      delete S.passHash; delete S.reg;
      cloudReady = true;
      const synced = await cloudSyncNow();
      if(!synced){ LK.err = 'حساب تأیید شد، اما ذخیره اولیه اطلاعات انجام نشد. تنظیمات دیتابیس را بررسی کنید.'; renderLock(); return; }
      LK.f = { mail:S.email, pass:'', pass2:'' };
      resetToList();
      return lkUnlock();
    }
    try{ await cloudLoad(); cloudReady = true; }
    catch(e){ LK.err = 'دریافت اطلاعات حساب انجام نشد. اتصال اینترنت را بررسی کنید.'; renderLock(); return; }
    LK.recoveryVerified = true; recClear();
    LK.mode = 'newpass'; LK.f.pass = ''; LK.f.pass2 = ''; renderLock(); return;
  }
  if(LK.mode === 'chgOff'){
    if(LK.buf === S.pin){ delete S.pin; save(); LK.newPin = ''; return lkUnlock(); }
    LK.err = 'رمز فعلی اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'chg0'){
    if(LK.buf === S.pin){ LK.mode = 'setup1'; LK.buf = ''; LK.err = ''; renderLock(); return; }
    LK.err = 'رمز فعلی اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock(); return;
  }
  if(LK.mode === 'setup1'){
    LK.newPin = LK.buf; LK.buf = ''; LK.mode = 'setup2'; LK.err = ''; renderLock(); return;
  }
  if(LK.mode === 'setup2'){
    if(LK.buf === LK.newPin){ S.pin = LK.buf; save(); LK.newPin = ''; return lkUnlock(); }
    LK.err = 'رمزها یکسان نیستند. دوباره انتخاب کنید.';
    LK.buf = ''; LK.newPin = ''; LK.mode = 'setup1'; renderLock(); return;
  }
  if(LK.mode === 'recover'){
    if(LK.buf === LK.recCode){
      LK.recCode = ''; delete S.pin; save();
      LK.mode = 'setup1'; LK.buf = ''; LK.showPad = true;
      LK.err = 'رمز جدید را انتخاب کنید.'; renderLock(); return;
    }
    LK.err = 'کد اشتباه است.'; LK.buf = ''; LK.shake = true; renderLock();
  }
}
async function hashPw(mail, pw){
  try{
    const b = new TextEncoder().encode('hd1|' + pw);
    const h = await crypto.subtle.digest('SHA-256', b);
    return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
  }catch(e){ return 'p:' + btoa(unescape(encodeURIComponent(pw))); }
}

async function authLogin(){
  readF();
  const mail = LK.f.mail, pw = LK.f.pass;
  if(!mailOk(mail)) return authErr('ایمیل معتبر وارد کنید.');
  if(!pw) return authErr('رمز عبور را وارد کنید.');
  if(!supabaseClient) return authErr('کتابخانه اتصال بارگذاری نشد. صفحه را تازه‌سازی کنید.');
  if(!navigator.onLine) return authErr('به اینترنت وصل نیستید. اینترنت را روشن کنید و دوباره وارد شوید.');
  lkSay('در حال بررسی حساب...', 'busy');
  let res;
  try{ res = await withTimeout(supabaseClient.auth.signInWithPassword({ email:mail, password:pw }), 20000); }
  catch(e){ return authErr('ورود انجام نشد؛ اتصال اینترنت را بررسی کنید.'); }
  const { data, error } = res;
  if(error){
    if(String(error.message || '').toLowerCase().includes('not confirmed')) return authErr('حساب شما هنوز تأیید نشده است. ایمیل تأیید را باز کنید.');
    return authErr('ایمیل یا رمز عبور درست نیست. اگر حساب قدیمی دارید، رمز را بازیابی کنید.');
  }
  cloudUser = data.user; cloudReady = false;
  try{ await cloudLoad(); cloudReady = true; }
  catch(e){ await supabaseClient.auth.signOut(); cloudUser = null; return authErr('دریافت اطلاعات حساب از پایگاه داده ناموفق بود. تنظیمات دیتابیس را بررسی کنید.'); }
  S.email = cloudUser.email || mail; S.loggedIn = true;
  delete S.passHash; delete S.reg;
  LK.f.pass = '';
  lkSay('با موفقیت وارد حساب خود شدید', 'ok');
  await new Promise(r => setTimeout(r, 1000));
  LK.err = ''; LK.kind = '';
  if(LK.pinReset){ LK.pinReset = false; delete S.pin; save(); }
  resetToList();
  if(S.pin){ LK.locked = true; LK.mode = 'unlock'; renderLock(); render(); }
  else lkUnlock();
}

async function authForgot(){

function calRender(){
  const el = document.getElementById('cal');
  if(!CAL.open){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  const t = today();
  const foot = `
    <div class="cal-foot">
      <button type="button" class="cal-cancel" data-a="calCancel">انصراف</button>
      <button type="button" class="cal-ok" data-a="calOk">تأیید تاریخ</button>
    </div>`;

  if(CAL.mode === 'years'){
    const lo = Math.min(t.y - 10, CAL.sel.y), hi = Math.max(t.y + 5, CAL.sel.y);
    let ys = '';
    for(let y = lo; y <= hi; y++){
      ys += `<button type="button" class="${y === CAL.vy ? 'sel' : ''}" data-a="calYear" data-v="${y}">${fa(y)}</button>`;
    }

        <div class="cal-years">${ys}</div>

    return;
  }

  const dim = daysIn(CAL.vy, CAL.vm);
  const first = (jToDate(CAL.vy, CAL.vm, 1).getDay() + 1) % 7;
  let g = '';
  for(let i = 0; i < first; i++) g += '<span class="blank"></span>';
  for(let d = 1; d <= dim; d++){

/* long press (1 second) on a card shows edit / delete buttons */
/* Hold for one second: the card starts shaking after a short moment,
   and at one second the edit/delete buttons appear. Lifting the finger
   or moving it early cancels the hold. */
let LPEL = null, LPS = null;
function lpStart(e){
  LPJUST = false;
  clearTimeout(LPT); clearTimeout(LPS);
  if(LPEL){ LPEL.classList.remove('shaking'); LPEL = null; }
  const el = e.target && e.target.closest ? e.target.closest('[data-lp]') : null;
  if(!el) return;
  LPEL = el;
  LPS = setTimeout(() => el.classList.add('shaking'), 350);
  LPT = setTimeout(() => {
    const key = el.dataset.lp;
    const [kind, pid, cid, tid] = key.split(':');
    LPSEL = { key, view: V.view, kind, pid, cid, tid };
    LPJUST = true;
    LPEL = null;
    render();
    if(navigator.vibrate) navigator.vibrate(20);
  }, el.dataset.hold ? parseInt(el.dataset.hold, 10) : 1000);
}
function lpCancel(){
  clearTimeout(LPT); clearTimeout(LPS);
  if(LPEL){ LPEL.classList.remove('shaking'); LPEL = null; }
}
document.addEventListener('touchstart', lpStart, {passive:true});
document.addEventListener('mousedown', lpStart);
['touchend','touchcancel','touchmove','mouseup'].forEach(ev => document.addEventListener(ev, lpCancel, {passive:true}));

/* ---------- customer photo ---------- */
let PHOTO = null;          /* pending photo: {blob, url} */
let CROP = null;           /* crop state while the crop sheet is open */
const CROP_S = 260;        /* crop square size in px */
const AVATAR_MAX = 5 * 1024;

function avatarPickHTML(src){
  return `<button class="avatar-big avatar-btn" data-a="pickPhoto" aria-label="انتخاب عکس">${src ? `<img src="${esc(src)}" alt="">` : ICON.user}<span class="cam-badge"><svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span></button>`;

    ? `<span class="av av-img"><img src="${esc(c.pf)}" alt="" loading="lazy"></span>`
    : `<span class="av" style="background:${col[0]};color:${col[1]}">${esc(c.n.charAt(0))}</span>`;
}
function onPhotoChosen(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('فقط فایل عکس انتخاب کنید.'); return; }
  const img = new Image();
  img.onload = () => {
    CROP = { img, zoom:1, x:0, y:0 };
    openSheet(`
      <div class="sh-h"><span>برش عکس</span><button class="ic" data-a="close" aria-label="بستن">${ICON.close}</button></div>
      <div class="crop-wrap"><canvas id="crop-cv" width="${CROP_S}" height="${CROP_S}"></canvas></div>
      <div class="hint">عکس را با انگشت جابه‌جا کنید و با نوار زیر بزرگ‌نمایی کنید.</div>
      <input type="range" id="crop-zoom" min="1" max="3" step="0.01" value="1" aria-label="بزرگ‌نمایی">
      <button class="btn pri-btn" data-a="cropOk">تأیید عکس</button>`);
    const cv = document.getElementById('crop-cv');
    const zoom = document.getElementById('crop-zoom');
    centerCrop(); drawCrop();
    let drag = null;
    cv.addEventListener('pointerdown', e => {
      drag = { px:e.clientX, py:e.clientY, x:CROP.x, y:CROP.y };
      cv.setPointerCapture(e.pointerId);
    });
    cv.addEventListener('pointermove', e => {
      if(!drag || !CROP) return;
      const k = CROP_S / cv.getBoundingClientRect().width;
      CROP.x = drag.x + (e.clientX - drag.px) * k;
      CROP.y = drag.y + (e.clientY - drag.py) * k;
      drawCrop();
    });
    const endDrag = () => { drag = null; };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    zoom.addEventListener('input', () => setZoom(parseFloat(zoom.value)));
  };
  img.onerror = () => alert('این فایل عکس باز نشد.');
  img.src = URL.createObjectURL(file);
}
function cropScale(){
  return Math.max(CROP_S / CROP.img.width, CROP_S / CROP.img.height) * CROP.zoom;
}
function clampCrop(){
  const sc = cropScale(), w = CROP.img.width * sc, h = CROP.img.height * sc;
  CROP.x = Math.min(0, Math.max(CROP_S - w, CROP.x));
  CROP.y = Math.min(0, Math.max(CROP_S - h, CROP.y));
}
function centerCrop(){
  const sc = cropScale();
  CROP.x = (CROP_S - CROP.img.width * sc) / 2;
  CROP.y = (CROP_S - CROP.img.height * sc) / 2;
  clampCrop();
}
function setZoom(z){
  const oldSc = cropScale();
  const cx = (CROP_S / 2 - CROP.x) / oldSc, cy = (CROP_S / 2 - CROP.y) / oldSc;
  CROP.zoom = z;
  const sc = cropScale();
  CROP.x = CROP_S / 2 - cx * sc;
  CROP.y = CROP_S / 2 - cy * sc;
  clampCrop(); drawCrop();
}
function drawCrop(){
  const cv = document.getElementById('crop-cv');
  if(!cv || !CROP) return;
  const ctx = cv.getContext('2d'), sc = cropScale();
  clampCrop();
  ctx.clearRect(0, 0, CROP_S, CROP_S);
  ctx.drawImage(CROP.img, CROP.x, CROP.y, CROP.img.width * sc, CROP.img.height * sc);
}
async function encodeAvatar(){
  const sc = cropScale(), side = CROP_S / sc;
  const sx = -CROP.x / sc, sy = -CROP.y / sc;
  let last = null;
  for(const size of [160, 128, 112, 96]){
    const out = document.createElement('canvas');
    out.width = out.height = size;
    out.getContext('2d').drawImage(CROP.img, sx, sy, side, side, 0, 0, size, size);
    for(const q of [0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2]){
      const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', q));
      if(blob){
        last = blob;
        if(blob.size <= AVATAR_MAX) return blob;
      }
    }
  }
  return last;
}
async function uploadAvatar(blob, cid){
  const path = `${cloudUser.id}/${String(cid).replace(/[^A-Za-z0-9_-]/g, '_')}.jpg`;
  const bucket = supabaseClient.storage.from('avatars');
  const { error } = await bucket.upload(path, blob, { upsert:true, contentType:'image/jpeg', cacheControl:'3600' });
  if(error) throw error;
  return bucket.getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
}
async function phoneTakenElsewhere(ph){
  try{
    const { data, error } = await supabaseClient.rpc('phone_taken', { p_phone: ph, p_owner: cloudUser.id });
    if(error){ console.error('phone check error:', error); return false; }
    return data === true;
  }catch(e){ console.error(e); return false; }
}

let KA = { t:null, state:'idle' };   /* idle | loading | ok | none | err */
function kaFmt(iso){
  try{
    const d = new Date(iso);
    const dt = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { year:'numeric', month:'long', day:'numeric' }).format(d);
    const tm = new Intl.DateTimeFormat('fa-IR', { hour:'2-digit', minute:'2-digit', hour12:false }).format(d);
    return dt + '، ساعت ' + tm;
  }catch(e){ return String(iso); }
}
function kaText(){
  if(KA.state === 'loading' || KA.state === 'idle') return 'در حال خواندن...';
  if(KA.state === 'err') return 'خوانده نشد';
  if(KA.state === 'none' || !KA.t) return 'هنوز بروز نشده';
  return kaFmt(KA.t);
}
function kaPaint(){
  const el = document.getElementById('ka-v'); if(!el) return;
  el.textContent = kaText();
  el.classList.remove('ok','old');
  if(KA.state === 'ok' && KA.t){
    const age = Date.now() - new Date(KA.t).getTime();
    el.classList.add(age > 3 * 86400000 ? 'old' : 'ok');
  }
}
async function kaLoad(){
  if(!supabaseClient || !cloudUser){ KA.state = 'err'; kaPaint(); return; }
  KA.state = 'loading'; kaPaint();
  try{
    const { data, error } = await supabaseClient.from('keepalive').select('last_ping').eq('id', 1).maybeSingle();
    if(error) throw error;
    if(data && data.last_ping){ KA.t = data.last_ping; KA.state = 'ok'; }
    else{ KA.t = null; KA.state = 'none'; }
  }catch(e){ console.warn('keepalive read:', e); KA.state = 'none'; }
  if(V.view === 'settings') kaPaint();
}

function pinHash(salt, code){
  const str = salt + '|' + code;
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h.toString(16);
}
function pinStream(salt, pin, n){ const k = pinHash(salt, pin); let o = ''; while(o.length < n) o += k; return o.slice(0, n); }
function pinEncode(code, salt, pin){
  const k = pinStream(salt, pin, code.length); let o = '';
  for(let i = 0; i < code.length; i++) o += (code.charCodeAt(i) ^ k.charCodeAt(i)).toString(16).padStart(4, '0');
  return o;
}
function pinDecode(enc, salt, pin){
  const n = Math.floor((enc || '').length / 4); const k = pinStream(salt, pin, n); let o = '';
  for(let i = 0; i < n; i++) o += String.fromCharCode(parseInt(enc.substr(i * 4, 4), 16) ^ k.charCodeAt(i));
  return o;
}

async function portalFetch(phone, code){
  if(!supabaseClient) return { err: 'اتصال برقرار نیست.' };
  const { data, error } = await supabaseClient.rpc('customer_portal', { p_code: code, p_phone: phone });

    return { invalid: m.includes('invalid') || m.includes('نامعتبر'), err: m.includes('locked') ? 'به‌دلیل تلاش‌های زیاد، ۳۰ دقیقه بعد دوباره امتحان کنید.'
      : m.includes('invalid') ? 'شماره موبایل یا کد وارد شده درست نیست.' : 'ورود انجام نشد: ' + m };
  }
  return { data };
}

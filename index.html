async function portalLogin(){
  if(PORTAL.busy) return;
  const phone = latin(val('pt-phone')).replace(/\D/g, '');
  const code = latin(val('pt-code')).replace(/\D/g, '');
  PORTAL.phone = phone; PORTAL.code = code;
  if(phone.length < 10){ PORTAL.err = 'شماره موبایل را کامل وارد کنید.'; return renderPortal(); }
  if(!/^[0-9]{6}$/.test(code)){ PORTAL.err = 'کد ۶ رقمی را وارد کنید.'; return renderPortal(); }
  if(portalOwnerView()){
    const hit = S.parties.flatMap(p => p.c.map(c => ({ c }))).find(x => x.c.ac === code && (x.c.ph || '').replace(/\D/g, '') === phone);
    if(!hit){ PORTAL.err = 'شماره موبایل یا کد وارد شده درست نیست.'; PORTAL.code = ''; return renderPortal(); }
    const c = hit.c;
    PORTAL.data = { name: c.n || '', photo: c.pf || '', transactions: (c.tx || []).map(t => ({
      d: t.d || '', a: Math.trunc(Number(t.a) || 0), y: Math.trunc(Number(t.y) || 0),
      m: Math.trunc(Number(t.m) || 1), dd: Math.trunc(Number(t.dd) || 1),
      ts: Math.trunc(Number(t.ts) || 0), hh: t.hh ?? null, mm: t.mm ?? null })) };
    PORTAL.err = ''; PORTAL.code = '';
    return renderPortal();
  }
  if(!supabaseClient){ PORTAL.err = 'اتصال برقرار نیست. صفحه را تازه کنید.'; return renderPortal(); }
  PORTAL.busy = true; PORTAL.err = 'در حال بررسی...'; renderPortal();
  const { data, error } = await supabaseClient.rpc('customer_portal', { p_code: code, p_phone: phone });
  PORTAL.busy = false;
  if(error){
    const m = String(error.message || '');
    PORTAL.err = m.includes('locked') ? 'به‌دلیل تلاش‌های زیاد، ۳۰ دقیقه بعد دوباره امتحان کنید.'
      : m.includes('invalid') ? 'شماره موبایل یا کد وارد شده درست نیست.'
      : 'ورود انجام نشد: ' + m;
    PORTAL.code = '';
    return renderPortal();
  }
  savePortalPhone(phone);
  rememberPortal(phone, code, data);
  PORTAL.data = data; PORTAL.err = ''; PORTAL.code = '';
  renderPortal();
}

/* ---------- clock picker (analog, drag the hand) ---------- */
let TCK = { h24:12, mi:0, mode:'hour', open:false };
let TC_DRAG = false, TC_JUST = false;
function clockText(h, m){
  const h12 = (h % 12) || 12;
  const per = h < 12 ? 'قبل از ظهر' : 'بعد از ظهر';
  return `${h12}:${p2(m)} ${per}`;
}
function clockSVG(){
  const C = 130, R = 92;
  const pt = (deg, r) => [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)];
  let nums = '';
  if(TCK.mode === 'hour'){
    for(let i = 1; i <= 12; i++){
      const [x, y] = pt(i * 30, R);
      nums += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${i}</text>`;
    }
  } else {
    for(let i = 0; i < 60; i += 5){
      const [x, y] = pt(i * 6, R);
      nums += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${p2(i)}</text>`;
    }
  }
  const ang = TCK.mode === 'hour' ? ((TCK.h24 % 12) * 30) : TCK.mi * 6;
  const [hx, hy] = pt(ang, TCK.mode === 'hour' ? 66 : 84);
  return `<svg class="tc-face" id="tc-face" viewBox="0 0 260 260">
    <circle cx="130" cy="130" r="126" class="face"/>
    ${nums}
    <line x1="130" y1="130" x2="${hx}" y2="${hy}" class="hand"/>
    <circle cx="${hx}" cy="${hy}" r="17" class="knob"/>
    <circle cx="130" cy="130" r="4" class="knob"/>
  </svg>`;
}
function tclkEl(){
  let el = document.getElementById('tclk');
  if(!el){
    el = document.createElement('div');
    el.id = 'tclk'; el.className = 'overlay cal-ov hidden';
    document.body.appendChild(el);
  }
  return el;
}
function tclkRender(){
  const el = tclkEl();
  const h12 = (TCK.h24 % 12) || 12, pm = TCK.h24 >= 12;
  el.innerHTML = `<div class="tc-box">
    <div class="tc-show">
      <button type="button" class="${TCK.mode === 'hour' ? 'on' : ''}" data-a="tcHour">${h12}</button>
      <span>:</span>
      <button type="button" class="${TCK.mode === 'minute' ? 'on' : ''}" data-a="tcMin">${p2(TCK.mi)}</button>
    </div>
    <div class="tc-ampm">
      <button type="button" class="${!pm ? 'on' : ''}" data-a="tcAm">قبل از ظهر</button>
      <button type="button" class="${pm ? 'on' : ''}" data-a="tcPm">بعد از ظهر</button>
    </div>
    ${clockSVG()}
    <div class="cal-foot">
      <button type="button" class="cal-cancel" data-a="tcCancel">انصراف</button>
      <button type="button" class="cal-ok" data-a="tcOk">تأیید ساعت</button>
    </div>
  </div>`;
  el.classList.remove('hidden');
}
function hideTclk(){

  const el = document.getElementById('tclk');
  if(el){ el.classList.add('hidden'); el.innerHTML = ''; }
}

function tcSetFromPoint(e, svg){
  const r = svg.getBoundingClientRect();
  const px = (e.clientX - r.left) * 260 / r.width, py = (e.clientY - r.top) * 260 / r.height;
  const deg = (Math.atan2(px - 130, -(py - 130)) * 180 / Math.PI + 360) % 360;
  if(TCK.mode === 'hour'){
    const pm = TCK.h24 >= 12;
    let h12 = Math.round(deg / 30) % 12; if(h12 === 0) h12 = 12;
    TCK.h24 = (h12 % 12) + (pm ? 12 : 0);
  } else {
    TCK.mi = Math.round(deg / 6) % 60;
  }
  tclkRender();
}
document.addEventListener('pointerdown', e => {
  const s = e.target.closest && e.target.closest('#tc-face');
  if(!s) return;
  TC_DRAG = true;
  tcSetFromPoint(e, s);
});
document.addEventListener('pointermove', e => {

  const s = document.getElementById('tc-face');

});
function tcEndDrag(){
  if(!TC_DRAG) return;
  TC_DRAG = false;
  TC_JUST = true; setTimeout(() => { TC_JUST = false; }, 300);
  if(TCK.mode === 'hour'){ TCK.mode = 'minute'; tclkRender(); }
}

      const k = localStorage.key(i);
      if(!k) continue;
      if(!(/^sb-.*-auth-token$/.test(k) || k === 'supabase.auth.token')) continue;
      const v = JSON.parse(localStorage.getItem(k) || 'null');
      const u = v?.user || v?.currentSession?.user;
      if(u && u.id) return u;
    }
  }catch(e){}
  return null;
}

/* ---------- همگام‌سازی لحظه‌ای بین گوشی‌ها (Supabase Realtime) ---------- */
let LIVE_CH = null, LIVE_T = null, LIVE_UID = null;
function startLive(){
  if(!supabaseClient || !cloudUser) return;
  if(LIVE_CH && LIVE_UID === cloudUser.id) return;
  if(LIVE_CH){ try{ supabaseClient.removeChannel(LIVE_CH); }catch(e){} }
  const uid = cloudUser.id;
  LIVE_UID = uid;
  const sub = table => ({ event:'*', schema:'public', table, filter:'u=eq.' + uid });
  try{
    LIVE_CH = supabaseClient.channel('hisab-live-' + uid)
      .on('postgres_changes', sub('p'), liveKick)
      .on('postgres_changes', sub('c'), liveKick)
      .on('postgres_changes', sub('t'), liveKick)
      .on('postgres_changes', sub('l'), liveKick)
      .on('postgres_changes', sub('nb'), liveKick)
      .on('postgres_changes', sub('ny'), liveKick)
      .on('postgres_changes', sub('s'), liveKick)
      .subscribe();
  }catch(e){ console.warn('realtime:', e); }
}
function liveKick(){
  clearTimeout(LIVE_T);
  LIVE_T = setTimeout(liveRefresh, 400);
}

  const pt = document.getElementById('portal');
  const ae = document.activeElement;
  return !!ov || (pt && !pt.classList.contains('hidden')) || (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
}
async function liveRefresh(){
  if(!cloudUser || !supabaseClient || !navigator.onLine) return;
  /* اگر همین گوشی در حال ثبت است، کمی صبر می‌کنیم تا تغییر خودش گم نشود */
  if(WRITING || cloudSyncing || NBLOADING){ clearTimeout(LIVE_T); LIVE_T = setTimeout(liveRefresh, 1200); return; }
  /* وسط نوشتن در فرم یا باز بودن پنجره، صفحه را دست نمی‌زنیم */
  if(liveUIBusy()){ clearTimeout(LIVE_T); LIVE_T = setTimeout(liveRefresh, 2000); return; }
  try{
    await cloudLoad();
    await nbLoad();
    if(!LK.locked) render();
  }catch(e){ console.warn('live refresh:', e); }
}

async function initCloudSession(){
  if(!supabaseClient){
    /* کتابخانه ابری در دسترس نیست (مثلاً آفلاین): اگر قبلاً وارد شده‌اید، با PIN و اطلاعات ذخیره‌شده باز شود */
    if(S.loggedIn && S.email){
      let su = false; try{ su = sessionStorage.getItem('hisab_unlocked') === '1'; }catch(e){}
      if(S.pin && !su){ LK.locked = true; LK.mode = 'unlock'; LK.buf = ''; LK.err = ''; LK.f.mail = S.email; renderLock(); render(); }
      else lkUnlock();
      return;
    }
    LK.locked = true; LK.err = 'اتصال Supabase بارگذاری نشد. اینترنت و آدرس پروژه را بررسی کنید.'; renderLock(); return;
  }
  const { data, error } = await supabaseClient.auth.getSession();
  let sessUser = data?.session?.user || null;
  /* اگر قبلاً وارد شده‌اید و PIN دارید، نشست ذخیره‌شده روی گوشی کافی است (حتی بدون اینترنت) */
  if(!sessUser && S.loggedIn && S.email) sessUser = storedSessionUser();
  if(error && !sessUser){ LK.locked = true; LK.err = 'خواندن نشست کاربری ناموفق بود.'; renderLock(); return; }
  if(!sessUser){
    cloudUser = null; cloudReady = false; LK.locked = true;
    const pr = recPending();
    if(pr){
      LK.mode = 'verify'; LK.purpose = 'recovery'; LK.buf = ''; LK.f.mail = pr.mail;
      LK.err = 'کُد ۸ رقمی ارسال‌شده به ایمیل را وارد کنید.';
    } else if(S.pin && S.email){
      LK.mode = 'unlock'; LK.buf = ''; LK.f.mail = S.email;
    } else {
      LK.mode = 'login'; LK.f.mail = '';
    }
    renderLock(); return;
  }
  cloudUser = sessUser; cloudReady = false;
  nbUseUser();
  S.loggedIn = true; delete S.passHash; delete S.reg;
  LK.f.mail = S.email || cloudUser.email || '';
  let stillUnlocked = false;
  try{ stillUnlocked = sessionStorage.getItem('hisab_unlocked') === '1'; }catch(e){}
  if(S.pin && !stillUnlocked){ LK.locked = true; LK.mode = 'unlock'; LK.buf = ''; LK.err = ''; renderLock(); render(); }
  else lkUnlock();
  /* اطلاعات ابری در پس‌زمینه خوانده می‌شود؛ اگر اینترنت نباشد، همان اطلاعات ذخیره‌شده نمایش داده می‌شود */
  refreshCloudQuiet();
}


/* ---- پشتیبان‌گیری: فایل در پوشهٔ دانلود ذخیره می‌شود ---- */
let BK_PANEL = '';
function showBackupAsk(){
  BK_PANEL = 'ask';
  history.pushState({ bk:1 }, '');
  render();
}
/* بستن پنل؛ اگر از دکمهٔ برگشت گوشی آمده باشد، دوباره history.back نمی‌زند */
function bkClose(fromPop){
  if(!BK_PANEL) return;
  BK_PANEL = '';
  if(!fromPop){ try{ history.back(); }catch(e){} }
  render();
}
window.addEventListener('popstate', () => { if(BK_PANEL) bkClose(true); });
function bkTimeTxt(now){
  const h = now.getHours();
  const h12 = (h % 12) || 12;
  const mi = String(now.getMinutes()).padStart(2, '0');
  return h12 + ':' + mi + ' ' + (h < 12 ? 'ق.ظ' : 'ب.ظ');
}
async function bkNotebooks(){
  /* یادداشت‌ها از سرور خوانده می‌شوند؛ اگر اینترنت نبود، نسخهٔ ذخیره‌شدهٔ همین حساب استفاده می‌شود */
  if(navigator.onLine && cloudUser){ try{ await nbLoad(); }catch(e){} }
  if(NB.length || NY.length) return { nb: NB, ny: NY };
  try{
    const c = JSON.parse(localStorage.getItem('hesab-nb-v1') || 'null');
    if(c && cloudUser && c.uid === cloudUser.id) return { nb: c.nb || [], ny: c.ny || [] };
  }catch(e){}
  return { nb: NB, ny: NY };
}
async function runBackup(){
  let cnt = 0; try{ cnt = Number(localStorage.getItem('hesab-backup-count') || 0); localStorage.setItem('hesab-backup-count', String(cnt + 1)); }catch(e){}
  const n = (cnt % 10) + 1;   /* شماره‌ها ۱ تا ۱۰ و دوباره از ۱ */
  const now = new Date();
  const parts = new Intl.DateTimeFormat('fa-IR-u-ca-persian-nu-latn', { day:'numeric', month:'numeric', year:'numeric' }).formatToParts(now);
  const pv = t => (parts.find(x => x.type === t) || {}).value || '';
  /* ترتیب: سال-روز-ماه، مثل 1405-21-8 */
  const dateTxt = pv('year') + '-' + pv('day') + '-' + pv('month');
  const timeTxt = bkTimeTxt(now);
  const fname = 'hisab.daftari-' + pv('day') + '-' + pv('month') + '-' + pv('year') + ' (' + n + ').json';
  const nbData = await bkNotebooks();
  const payload = {
    app: 'hisab-backup', version: 1, created: now.toISOString(), backupNo: n,
    data: { cur: S.cur || 'toman', parties: S.parties || [], ledger: S.ledger || [] },
    notebooks: { nb: nbData.nb || [], ny: nbData.ny || [] }
  };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  bkClose(false);
  showToast('پکاپ گیری با موفقیت در پوشه دانلود انجام شد', true);
}

initCloudSession();
